<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sign in · MJ4U Hook Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="/sb.js"></script>
</head><body>
<div class="login" id="login" hidden>
  <div><div class="eyebrow">MadeJustForYou · paid video tests</div><h1>Hook Lab</h1></div>
  <form class="panel" id="emailForm" novalidate>
    <label for="email" class="msg">Your email. We'll send a 6-digit code.</label>
    <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
    <button class="btn" id="sendBtn" type="submit">Send code</button>
    <p class="msg" id="emailMsg"></p>
  </form>
  <form class="panel" id="codeForm" hidden novalidate>
    <label for="code" class="msg" id="codeLabel">Enter the 6-digit code from your email.</label>
    <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{6,8}" required>
    <button class="btn" id="verifyBtn" type="submit">Sign in</button>
    <button class="linkbtn" id="backBtn" type="button">Use a different email</button>
    <p class="msg" id="codeMsg"></p>
  </form>
</div>
<script>
(function(){
const $=s=>document.querySelector(s), sb=window.HL_SB; let pendingEmail="";
sb.auth.getSession().then(({data})=>{ if(data.session) location.replace("/"); else { $("#login").hidden=false; $("#email").focus(); } });
$("#emailForm").addEventListener("submit",async e=>{ e.preventDefault();
  const email=$("#email").value.trim().toLowerCase(); if(!email){ $("#emailMsg").textContent="Enter your email."; return; }
  $("#sendBtn").disabled=true; $("#emailMsg").className="msg"; $("#emailMsg").textContent="Sending…";
  const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});
  $("#sendBtn").disabled=false;
  if(error){ $("#emailMsg").className="msg err";
    $("#emailMsg").textContent = /signup|not allowed|not found/i.test(error.message) ? "This email doesn't have access to Hook Lab."
      : /security purposes/i.test(error.message) ? "A code was just sent to this email. Wait 60 seconds before asking for another."
      : /rate/i.test(error.message) ? "Too many codes sent in the last hour. Try again later." : error.message; return; }
  pendingEmail=email; $("#emailForm").hidden=true; $("#codeForm").hidden=false;
  $("#codeLabel").textContent=`Enter the 6-digit code sent to ${email}.`; $("#code").value=""; $("#code").focus();
});
$("#codeForm").addEventListener("submit",async e=>{ e.preventDefault();
  const token=$("#code").value.replace(/\s/g,""); if(!/^\d{6,8}$/.test(token)){ $("#codeMsg").className="msg err"; $("#codeMsg").textContent="Enter the code from the email (6 digits)."; return; }
  $("#verifyBtn").disabled=true; $("#codeMsg").className="msg"; $("#codeMsg").textContent="Checking…";
  const {error}=await sb.auth.verifyOtp({email:pendingEmail,token,type:"email"});
  if(error){ $("#verifyBtn").disabled=false; $("#codeMsg").className="msg err"; $("#codeMsg").textContent="That code is wrong or expired. Request a new one."; return; }
  location.replace("/");
});
$("#backBtn").addEventListener("click",()=>{ $("#codeForm").hidden=true; $("#emailForm").hidden=false; $("#codeMsg").textContent=""; $("#email").focus(); });
})();
</script>
</body></html>
